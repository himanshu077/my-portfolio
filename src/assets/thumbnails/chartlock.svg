<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1f"/>
      <stop offset="1" stop-color="#161a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2e364f" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Illustration -->
  <circle cx="900" cy="380" r="70" fill="#2dd4bf" opacity="0.45" filter="url(#soft)"/>
  <rect x="700" y="330" width="120" height="100" rx="12" fill="#161a2c" stroke="#4d5775" stroke-width="2"/>
  <rect x="748" y="352" width="24" height="40" rx="12" fill="#c7d0e5"/>
  <path d="M740 380 a20 20 0 0 0 40 0 M760 400 v12 M748 412 h24" stroke="#c7d0e5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="760" y="452" text-anchor="middle" font-size="12" font-weight="600" fill="#6f7a9b">Dictate</text>
  <path d="M820 380 L852 380" stroke="#8ce7dc" stroke-width="2" stroke-opacity="0.8" fill="none"/>
  <circle cx="900" cy="380" r="46" fill="#161a2c" stroke="#2dd4bf" stroke-width="3"/>
  <text x="900" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f2fe">AI</text>
  <path d="M948 380 L980 380" stroke="#8ce7dc" stroke-width="2" stroke-opacity="0.8" fill="none"/>
  <rect x="980" y="300" width="150" height="160" rx="12" fill="#161a2c" stroke="#2dd4bf" stroke-width="2"/>
  <g stroke="#96a1c0" stroke-width="3" stroke-linecap="round"><path d="M1000 330 h70"/><path d="M1000 352 h110"/><path d="M1000 374 h90"/><path d="M1000 396 h110"/><path d="M1000 418 h60"/></g>
  <text x="1055" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#8ce7dc">EMR-ready chart</text>
  <rect x="760" y="500" width="280" height="40" rx="20" fill="#161a2c" stroke="#ff2e5b" stroke-opacity="0.8" stroke-width="2"/>
  <text x="900.0" y="525" text-anchor="middle" font-size="13" font-weight="700" fill="#ff7794">ZERO PHI STORED  ·  HIPAA</text>

  <!-- Copy -->
  <g>
    <rect x="88" y="200" width="200" height="34" rx="17" fill="#2dd4bf" fill-opacity="0.18" stroke="#2dd4bf" stroke-opacity="0.6"/>
    <text x="188.0" y="222" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.5" fill="#8ce7dc">AI MEDICAL CHARTING</text>
  </g>
  <text x="88" y="318" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">ChartLock</text>
  <text x="90" y="372" font-size="26" fill="#c7d0e5">Physicians dictate; AI writes the</text>
  <text x="90" y="408" font-size="26" fill="#c7d0e5">EMR-ready chart. No PHI is stored.</text>
  <g font-size="15" fill="#96a1c0">
    <text x="90" y="480">Node.js · TypeScript · Azure Functions · Azure OpenAI · Cosmos DB</text>
  </g>
</svg>
