<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1f"/>
      <stop offset="1" stop-color="#161a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2e5b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2e5b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2e364f" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Workflow nodes -->
  <g stroke="#96a1c0" stroke-width="2.5" fill="none" stroke-opacity="0.8">
    <path d="M780 300 C 830 300, 830 240, 880 240"/>
    <path d="M780 300 C 830 300, 830 360, 880 360"/>
    <path d="M1000 240 C 1050 240, 1050 300, 1100 300"/>
    <path d="M1000 360 C 1050 360, 1050 300, 1100 300"/>
    <path d="M660 300 L 720 300"/>
  </g>

  <g fill="#161a2c" stroke="#2e364f" stroke-width="2">
    <rect x="600" y="270" width="120" height="60" rx="14" stroke="#ffdc30"/>
    <rect x="880" y="210" width="120" height="60" rx="14" stroke="#a87dff"/>
    <rect x="880" y="330" width="120" height="60" rx="14" stroke="#a87dff"/>
    <rect x="1100" y="270" width="120" height="60" rx="14" stroke="#00f090"/>
  </g>
  <g fill="#c7d0e5" font-size="13" font-weight="600" text-anchor="middle">
    <text x="660" y="296">Schedule</text>
    <text x="940" y="236">Claude writes</text>
    <text x="940" y="356">Claude checks</text>
    <text x="1160" y="296">Slack ✓</text>
  </g>
  <g fill="#6f7a9b" font-size="11" text-anchor="middle">
    <text x="660" y="315">cron trigger</text>
    <text x="940" y="255">draft post</text>
    <text x="940" y="375">QA score</text>
    <text x="1160" y="315">approval</text>
  </g>

  <!-- node connector dots -->
  <g fill="#ff2e5b">
    <circle cx="720" cy="300" r="5"/>
    <circle cx="880" cy="240" r="5"/>
    <circle cx="880" cy="360" r="5"/>
    <circle cx="1000" cy="240" r="5"/>
    <circle cx="1000" cy="360" r="5"/>
    <circle cx="1100" cy="300" r="5"/>
  </g>

  <!-- second row hint -->
  <g fill="#161a2c" stroke="#2e364f" stroke-width="2" opacity="0.55">
    <rect x="600" y="440" width="120" height="60" rx="14"/>
    <rect x="800" y="440" width="120" height="60" rx="14"/>
    <rect x="1000" y="440" width="120" height="60" rx="14"/>
  </g>
  <g stroke="#96a1c0" stroke-width="2.5" fill="none" stroke-opacity="0.4">
    <path d="M720 470 L800 470"/>
    <path d="M920 470 L1000 470"/>
  </g>
  <g fill="#6f7a9b" font-size="12" text-anchor="middle" opacity="0.8">
    <text x="660" y="475">YouTube API</text>
    <text x="860" y="475">Score + report</text>
    <text x="1060" y="475">Docs · Gmail</text>
  </g>

  <!-- Copy -->
  <g>
    <rect x="88" y="200" width="164" height="34" rx="17" fill="#ff2e5b" fill-opacity="0.16" stroke="#ff2e5b" stroke-opacity="0.6"/>
    <text x="170" y="222" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.5" fill="#ff8aa3">N8N AUTOMATION</text>
  </g>
  <text x="88" y="318" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">n8n Pipelines</text>
  <text x="90" y="372" font-size="26" fill="#c7d0e5">Self-checking AI workflows for</text>
  <text x="90" y="408" font-size="26" fill="#c7d0e5">LinkedIn content and YouTube reports.</text>
  <text x="90" y="480" font-size="15" fill="#96a1c0">n8n Cloud · Claude · Supabase · Slack · Google Workspace</text>
</svg>
