<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1f"/>
      <stop offset="1" stop-color="#161a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2e364f" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Illustration -->
  <circle cx="900" cy="380" r="70" fill="#fb923c" opacity="0.4" filter="url(#soft)"/>
  <rect x="700" y="340" width="120" height="80" rx="12" fill="#161a2c" stroke="#4d5775" stroke-width="2"/>
  <text x="760" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#c7d0e5">New lead</text>
  <text x="760" y="396" text-anchor="middle" font-size="11" font-weight="600" fill="#6f7a9b">web form</text>
  <path d="M820 380 L852 380" stroke="#fdc394" stroke-width="2" stroke-opacity="0.8" fill="none"/>
  <circle cx="900" cy="380" r="46" fill="#161a2c" stroke="#fb923c" stroke-width="3"/>
  <text x="900" y="375" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f2fe">Gemini</text>
  <text x="900" y="393" text-anchor="middle" font-size="10" font-weight="600" fill="#fdc394">voice + SMS</text>
  <path d="M946 360 L985 320" stroke="#fdc394" stroke-width="2" stroke-opacity="0.8" fill="none"/>
  <path d="M946 400 L985 440" stroke="#fdc394" stroke-width="2" stroke-opacity="0.8" fill="none"/>
  <rect x="985" y="290" width="140" height="60" rx="12" fill="#161a2c" stroke="#fdc394" stroke-width="2"/>
  <text x="1055" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d0e5">AI phone call</text>
  <text x="1055" y="335" text-anchor="middle" font-size="10" font-weight="600" fill="#6f7a9b">qualifies in 90s</text>
  <rect x="985" y="410" width="140" height="60" rx="12" fill="#161a2c" stroke="#fdc394" stroke-width="2"/>
  <text x="1055" y="436" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d0e5">SMS nurture</text>
  <text x="1055" y="455" text-anchor="middle" font-size="10" font-weight="600" fill="#6f7a9b">follow-up drips</text>
  <rect x="790" y="510" width="220" height="40" rx="20" fill="#161a2c" stroke="#00f090" stroke-opacity="0.8" stroke-width="2"/>
  <text x="900.0" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#59f5b7">Booked appointment</text>

  <!-- Copy -->
  <g>
    <rect x="88" y="200" width="190" height="34" rx="17" fill="#fb923c" fill-opacity="0.18" stroke="#fb923c" stroke-opacity="0.6"/>
    <text x="183.0" y="222" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.5" fill="#fdc394">AI LEAD GENERATION</text>
  </g>
  <text x="88" y="318" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">SmartContact AI</text>
  <text x="90" y="372" font-size="26" fill="#c7d0e5">Gemini voice calls and SMS campaigns</text>
  <text x="90" y="408" font-size="26" fill="#c7d0e5">qualify leads for service businesses.</text>
  <g font-size="15" fill="#96a1c0">
    <text x="90" y="480">Next.js · React · TypeScript · Gemini 2.0 · Twilio · Node.js</text>
  </g>
</svg>
