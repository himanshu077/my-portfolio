<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1f"/>
      <stop offset="1" stop-color="#161a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2e364f" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Illustration -->
  <circle cx="900" cy="380" r="70" fill="#60a5fa" opacity="0.28" filter="url(#soft)"/>
  <rect x="800" y="220" width="200" height="330" rx="26" fill="#161a2c" stroke="#4d5775" stroke-width="2"/>
  <rect x="822" y="250" width="156" height="60" rx="12" fill="#0b0e1f" stroke="#2e364f"/>
  <text x="900" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#6f7a9b">Q 4 / 10</text>
  <text x="900" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f2fe">Capital of Japan?</text>
  <rect x="822" y="326" width="156" height="36" rx="10" fill="#0b0e1f" stroke="#2e364f"/>
  <text x="900" y="349" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d0e5">Seoul</text>
  <rect x="822" y="372" width="156" height="36" rx="10" fill="#60a5fa" fill-opacity="0.18" stroke="#60a5fa"/>
  <text x="900" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#90c0fc">Tokyo  ✓</text>
  <rect x="822" y="418" width="156" height="36" rx="10" fill="#0b0e1f" stroke="#2e364f"/>
  <text x="900" y="441" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d0e5">Bangkok</text>
  <rect x="822" y="464" width="156" height="36" rx="10" fill="#0b0e1f" stroke="#2e364f"/>
  <text x="900" y="487" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d0e5">Beijing</text>
  <rect x="840" y="518" width="120" height="8" rx="4" fill="#2e364f"/><rect x="840" y="518" width="48" height="8" rx="4" fill="#60a5fa"/>

  <!-- Copy -->
  <g>
    <rect x="88" y="200" width="160" height="34" rx="17" fill="#60a5fa" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="168.0" y="222" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.5" fill="#a8cefc">MOBILE QUIZ APP</text>
  </g>
  <text x="88" y="318" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">Quiz Flutter</text>
  <text x="90" y="372" font-size="26" fill="#c7d0e5">Timed quizzes across topics with</text>
  <text x="90" y="408" font-size="26" fill="#c7d0e5">instant scoring and progress tracking.</text>
  <g font-size="15" fill="#96a1c0">
    <text x="90" y="480">Flutter · Dart</text>
  </g>
</svg>
