<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1f"/>
      <stop offset="1" stop-color="#161a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdc30" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffdc30" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2e364f" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Illustration -->
  <circle cx="900" cy="380" r="70" fill="#ffdc30" opacity="0.22" filter="url(#soft)"/>
  <rect x="700" y="290" width="110" height="200" rx="18" fill="#161a2c" stroke="#4d5775" stroke-width="2"/>
  <rect x="716" y="316" width="78" height="14" rx="4" fill="#2e364f"/><rect x="716" y="340" width="78" height="14" rx="4" fill="#2e364f"/><rect x="716" y="364" width="52" height="14" rx="4" fill="#2e364f"/>
  <text x="755" y="470" text-anchor="middle" font-size="11" font-weight="600" fill="#6f7a9b">Gmail receipts</text>
  <path d="M812 380 L852 380" stroke="#ffdc30" stroke-width="2" stroke-opacity="0.8" fill="none"/>
  <circle cx="900" cy="380" r="46" fill="#161a2c" stroke="#ffdc30" stroke-width="3"/>
  <text x="900" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f2fe">OpenAI</text>
  <text x="900" y="394" text-anchor="middle" font-size="10" font-weight="600" fill="#ffdc30">parse</text>
  <path d="M946 380 L985 380" stroke="#ffdc30" stroke-width="2" stroke-opacity="0.8" fill="none"/>
  <rect x="985" y="330" width="150" height="100" rx="12" fill="#161a2c" stroke="#ffdc30" stroke-width="2"/>
  <text x="1060" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d0e5">Return window</text>
  <text x="1060" y="380" text-anchor="middle" font-size="20" font-weight="800" fill="#ffdc30">12 days left</text>
  <text x="1060" y="405" text-anchor="middle" font-size="10" font-weight="600" fill="#6f7a9b">40+ retailers</text>
  <rect x="790" y="510" width="220" height="40" rx="20" fill="#161a2c" stroke="#ff2e5b" stroke-opacity="0.8" stroke-width="2"/>
  <text x="900.0" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#ff7794">DoorDash pickup booked</text>

  <!-- Copy -->
  <g>
    <rect x="88" y="200" width="200" height="34" rx="17" fill="#ffdc30" fill-opacity="0.18" stroke="#ffdc30" stroke-opacity="0.6"/>
    <text x="188.0" y="222" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.5" fill="#ffec8d">AI RETURNS ASSISTANT</text>
  </g>
  <text x="88" y="318" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-2">Snapback Returns</text>
  <text x="90" y="372" font-size="26" fill="#c7d0e5">Finds receipts in Gmail, tracks return</text>
  <text x="90" y="408" font-size="26" fill="#c7d0e5">windows, books a courier for the return.</text>
  <g font-size="15" fill="#96a1c0">
    <text x="90" y="480">React Native · Expo · TypeScript · OpenAI · Node.js · Prisma</text>
  </g>
</svg>
